<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- TABELA -->
    <header>
        <h1> TABELAS TOP </h1>
    </header>
    <main>
        <h2> PRODUTOS</h2>
        <!--CRIAÇÃO DA TABELA-->
        <!--BORDER = PROBRIEDADES-->
        <table border="5">
            <!-- thead = CABEÇALHO DA TABELA -->
             <thead>
                <!-- tr = LINHA DO CABEÇALHO -->
                <tr>
                    <!-- th = CÉLULA DE CABEÇALHO -->
                    <th>ID</th>
                    <TH>NOME</TH>
                    <TH>QUANTIDADE</TH>
                    <TH>PREÇO</TH>
                    <TH>CATEGORIA</TH>
                </tr>
             </thead>
             <!-- tbody = CORPO DA TABELA -->
              <tbody>
            <TR>
<!--TD = CÉLULA DA LINHA DO CORPO-->
<TD>1</TD>
<TD>SHAMPOO CR7</TD>
<TD>7</TD>
<TD>R$77</TD>
<TD>BELEZA</TD>

<!-- tr*2>td*5-->
 <tr>
    <td>2</td>
    <td>monitor odyssey</td>
    <td>3</td>
    <td>R$caro</td>
    <td>Essencial</td>
 </tr>

 <tr>
    <td>3</td>
    <!--colspan = diz quantas colunas o elemento deve ocupar-->

    <!--rowspan = diz quantas linhas o elemento deve ocupar-->
    <td rowspan="2">filhos</td>



    <tr>
    <td>4</td>
    <td>Lavador nasal</td>
    <td>1</td>

 </tr>
 </tr>


              </tbody>
              <!-- tfoot = RODAPÉ DA TABELA -->
               <tfoot>
                <tr>
                    <td colspan="5">TABELA FEITA POR: GLEIDSON</td>
                </tr>
               </tfoot>
        </table>
    </main>

    <footer>
        <p> Segue nois </p>
    </footer>
</body>
</html>
